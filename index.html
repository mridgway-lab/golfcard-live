<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>GolfCard Live</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#c8c8c8;--acc:#7FE0A0;--line:#333;--under:#ff6b6b}
@media (prefers-color-scheme:light){:root{--bg:#fff;--fg:#000;--dim:#333;--acc:#1E4D36;--line:#ccc;--under:#b00020}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px -apple-system,system-ui,sans-serif;padding:16px max(12px,env(safe-area-inset-left))}
h1{font-size:24px;margin:0}.sub{color:var(--dim);font-size:14px;margin:4px 0 14px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.lb{width:100%;border-collapse:collapse}.lb td{padding:8px 4px;border-bottom:1px solid var(--line);font-size:19px}
.n{font-weight:700}.r{text-align:right;font-variant-numeric:tabular-nums}.u{color:var(--acc);font-weight:700}
.wrap{overflow-x:auto}.sc{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.sc th,.sc td{border:1px solid var(--line);padding:4px 6px;text-align:center;min-width:22px}
.sc th{color:var(--dim);font-weight:600}.b{font-weight:800}.cur{outline:2px solid var(--acc)}
.st{margin:4px 0;font-weight:600}.err{color:var(--dim)}
</style></head><body>
<h1 id="course">GolfCard Live</h1><div class="sub" id="sub">Loading…</div>
<div id="app"></div>
<script>
// Reads one record from the CloudKit PUBLIC database with a read-only API token (safe to publish).
const C="iCloud.com.dtrt.golfcard", ENV="production", TOKEN="PASTE_READ_ONLY_TOKEN";
const id=new URLSearchParams(location.search).get("r");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tp=v=>v===0?"E":(v>0?"+"+v:""+v);
const $=s=>document.getElementById(s);
async function load(){
  if(!id){$("sub").textContent="No round in this link.";return}
  try{
    const res=await fetch(`https://api.apple-cloudkit.com/database/1/${C}/${ENV}/public/records/lookup?ckAPIToken=${TOKEN}`,
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records:[{recordName:"live-"+id.toLowerCase()}]})});
    const j=await res.json(), rec=j.records&&j.records[0];
    if(!rec||!rec.fields){$("sub").textContent="Waiting for the first score…";return}
    render(JSON.parse(rec.fields.payload.value));
  }catch(e){$("sub").innerHTML='<span class="err">Can\'t reach the scoreboard. Retrying…</span>'}
}
function render(b){
  document.title=b.course+" · Live";$("course").textContent=b.course;
  const t=new Date(b.updatedAt);
  $("sub").textContent=`Hole ${b.currentHole} · ${b.basis} · updated ${t.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`;
  const rows=[...b.rows].sort((x,y)=>x.toPar-y.toPar);
  let h='<div class="card"><table class="lb">'+rows.map(r=>`<tr><td class="n">${esc(r.name)}</td><td class="r ${r.toPar<0?"u":""}">${r.thru?tp(r.toPar):"–"}</td><td class="r">${r.total||""}</td><td class="r" style="color:var(--dim)">thru ${r.thru}</td>${r.money!=null?`<td class="r b">${r.money<0?"−":"+"}$${Math.abs(r.money).toFixed(0)}</td>`:""}</tr>`).join("")+'</table></div>';
  if(b.standings.length)h+='<div class="card">'+b.standings.map(s=>`<div class="st">${esc(s)}</div>`).join("")+'</div>';
  h+='<div class="card wrap"><table class="sc"><tr><th>Hole</th>'+b.pars.map((_,i)=>`<th class="${i+1==b.currentHole?"cur":""}">${i+1}</th>`).join("")+'<th>Tot</th></tr>';
  h+='<tr><th>Par</th>'+b.pars.map(p=>`<td>${p}</td>`).join("")+`<td>${b.pars.reduce((a,c)=>a+c,0)}</td></tr>`;
  h+=b.rows.map(r=>`<tr><th>${esc(r.name)}</th>`+r.gross.map((g,i)=>`<td class="${g!=null&&g<b.pars[i]?"u":""}">${g??""}</td>`).join("")+`<td class="b">${r.total||""}</td></tr>`).join("")+'</table></div>';
  $("app").innerHTML=h;
}
load();setInterval(()=>{if(!document.hidden)load()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
